[package]
name = "hit"
version = "0.1.0"
edition = "2021"
authors = ["Hit Core Team <team@hit-scm.com>"]
description = "A next-generation, blazingly fast source control system built for delightful developer experience."
repository = "https://github.com/hit-scm/hit"
homepage = "https://hit-scm.com"
license = "MIT OR Apache-2.0"
keywords = ["vcs", "git", "source-control", "developer-tools", "fast"]
categories = ["command-line-utilities", "development-tools::version-control"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "suggestions", "color"] }
clap_complete = "4.5"
blake3 = "1.5"
zstd = "0.13"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
chrono = "0.4"
similar = { version = "2.6", features = ["inline"] }
walkdir = "2.5"
ignore = "0.4"
directories = "5.0"
strsim = "0.11"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
