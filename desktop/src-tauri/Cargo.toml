[package]
name = "hit-desktop"
version = "0.1.0"
description = "Lightweight desktop client for Hit source control"
authors = ["Hit Core Team <team@hit-scm.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
hit = { path = "../.." }
