name: Feature Request
description: Propose an idea or enhancement for Hit.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature proposals help guide the Hit roadmap. Please outline your suggestion below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or friction does this proposal address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution and CLI Interface
      description: Describe the proposed command syntax, behavior, or UX improvements.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches or workarounds evaluated.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Relevant background, references, or benchmark data.
