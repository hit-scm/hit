name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hit-x86_64-unknown-linux-gnu
            asset_name: hit-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: hit-aarch64-unknown-linux-gnu
            asset_name: hit-${{ github.ref_name }}-aarch64-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hit-x86_64-apple-darwin
            asset_name: hit-${{ github.ref_name }}-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hit-aarch64-apple-darwin
            asset_name: hit-${{ github.ref_name }}-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hit-x86_64-pc-windows-msvc
            asset_name: hit-${{ github.ref_name }}-x86_64-windows.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux AArch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/hit dist/
          cp README.md LICENSE dist/
          tar -czvf ${{ matrix.asset_name }} -C dist .
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/hit.exe dist/
          cp README.md LICENSE dist/
          7z a ${{ matrix.asset_name }} ./dist/*
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

