name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux (glibc & static musl) ---
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: hit-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: hit-x86_64-unknown-linux-musl.tar.gz
            use_cross: false
            install_musl: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: hit-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: hit-aarch64-unknown-linux-musl.tar.gz
            use_cross: true

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            asset_name: hit-armv7-unknown-linux-gnueabihf.tar.gz
            use_cross: true

          # --- macOS (Apple Silicon) ---
          - os: macos-15
            target: aarch64-apple-darwin
            asset_name: hit-aarch64-apple-darwin.tar.gz
            use_cross: false

          # --- Windows (x86_64, ARM64, i686) ---
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: hit-x86_64-pc-windows-msvc.zip
            use_cross: false

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: hit-aarch64-pc-windows-msvc.zip
            use_cross: false

          - os: windows-latest
            target: i686-pc-windows-msvc
            asset_name: hit-i686-pc-windows-msvc.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.install_musl == true
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary (native or cross)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hit dist/
          cp README.md LICENSE dist/
          tar -czvf ${{ matrix.asset_name }} -C dist .
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hit.exe dist/
          cp README.md LICENSE dist/
          7z a ${{ matrix.asset_name }} ./dist/*
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-artifact
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 1

  # Aggregate all checksums and publish the release
  publish-release:
    name: Publish Release & Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate master SHA256SUMS.txt
        run: |
          cd all-artifacts
          cat *.sha256 > SHA256SUMS.txt
          echo "Generated master checksum file:"
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Hit ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            all-artifacts/*.tar.gz
            all-artifacts/*.zip
            all-artifacts/*.sha256
            all-artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
